name: flutter_arch_comp
description: Demo sample for Flutter Architecture Components ported to use Minimal MVN

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # https://pub.dev/packages/cached_network_image
  cached_network_image: ^3.4.1
  # https://pub.dev/packages/dart_mappable
  dart_mappable: ^4.8.0
  # https://pub.dev/packages/flutter_svg
  flutter_svg: ^2.3.0
  # https://pub.dev/packages/http
  http: ^1.6.0
  # https://pub.dev/packages/json_annotation
  json_annotation: ^4.12.0
  # https://pub.dev/packages/minimal_mvn
  minimal_mvn: ^3.0.0
  # https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # https://pub.dev/packages/build_runner
  build_runner: ^2.15.0
  # https://pub.dev/packages/dart_mappable_builder
  dart_mappable_builder: ^4.9.0
  # https://pub.dev/packages/flutter_lints
  flutter_lints: ^6.0.0
  # https://pub.dev/packages/json_serializable
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
